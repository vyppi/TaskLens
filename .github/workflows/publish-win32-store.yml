name: Publish Win32 app to Microsoft Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tasklens-win32-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Validate publishing configuration
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $required = @{
            AZURE_AD_TENANT_ID = $env:TENANT_ID
            AZURE_AD_APPLICATION_CLIENT_ID = $env:CLIENT_ID
            AZURE_AD_APPLICATION_SECRET = $env:CLIENT_SECRET
            SELLER_ID = $env:SELLER_ID
            WINDOWS_SIGNING_CERTIFICATE_BASE64 = $env:CERTIFICATE_BASE64
            WINDOWS_SIGNING_CERTIFICATE_PASSWORD = $env:CERTIFICATE_PASSWORD
            STORE_PRODUCT_ID = $env:PRODUCT_ID
          }
          $missing = @(
            $required.GetEnumerator() |
              Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } |
              ForEach-Object Key
          )
          if ($missing.Count -gt 0) {
            throw "Missing GitHub configuration: $($missing -join ', ')"
          }

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Assign release version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $releaseTag = "store-$version-${{ github.run_attempt }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Restore signing certificate
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "tasklens-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "SIGNING_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Build signed MSI
        id: package
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $output = & .\scripts\Build-StoreMsi.ps1 `
            -ProductVersion "${{ steps.version.outputs.version }}" `
            -CertificatePath "$env:SIGNING_CERTIFICATE_PATH" `
            -CertificatePassword "$env:CERTIFICATE_PASSWORD"
          $output | Write-Host
          $msiPath = ($output | Select-String '^MSI_PATH=').Line.Split('=', 2)[1]
          $hash = ($output | Select-String '^MSI_SHA256=').Line.Split('=', 2)[1]
          "msi_path=$msiPath" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Verify silent installer extraction
        shell: pwsh
        run: |
          $msi = "${{ steps.package.outputs.msi_path }}"
          $target = Join-Path $env:RUNNER_TEMP "tasklens-msi-validation"
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process msiexec.exe `
            -ArgumentList @("/a", "`"$msi`"", "TARGETDIR=`"$target`"", "/qn", "/norestart") `
            -Wait `
            -PassThru
          if ($install.ExitCode -notin 0, 3010) {
            throw "Silent administrative extraction failed with exit code $($install.ExitCode)."
          }
          if (-not (Get-ChildItem $target -Recurse -Filter TaskLens.App.exe)) {
            throw "The MSI did not extract the TaskLens executable."
          }

      - name: Publish immutable installer URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.release_tag }}"
          $msi = "${{ steps.package.outputs.msi_path }}"
          $notes = @"
          TaskLens ${{ steps.version.outputs.version }}

          SHA-256: ${{ steps.package.outputs.sha256 }}
          Source commit: ${{ github.sha }}
          "@
          gh release create $tag `
            "$msi#TaskLens.Installer.msi" `
            --target "${{ github.sha }}" `
            --title "TaskLens ${{ steps.version.outputs.version }}" `
            --notes $notes

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/TaskLens.Installer.msi"
          Invoke-WebRequest -Method Head -Uri $url -UseBasicParsing | Out-Null
          "STORE_INSTALLER_URL=$url" >> $env:GITHUB_ENV

      - name: Update and submit Partner Center draft
        id: submission
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $required = @{
            AZURE_AD_TENANT_ID = $env:TENANT_ID
            AZURE_AD_APPLICATION_CLIENT_ID = $env:CLIENT_ID
            AZURE_AD_APPLICATION_SECRET = $env:CLIENT_SECRET
            SELLER_ID = $env:SELLER_ID
            STORE_PRODUCT_ID = $env:PRODUCT_ID
          }
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($item.Value)) {
              throw "$($item.Key) is not configured."
            }
          }

          $output = & .\scripts\Publish-MsiStoreSubmission.ps1 `
            -TenantId $env:TENANT_ID `
            -ClientId $env:CLIENT_ID `
            -ClientSecret $env:CLIENT_SECRET `
            -SellerId $env:SELLER_ID `
            -ProductId $env:PRODUCT_ID `
            -PackageUrl $env:STORE_INSTALLER_URL `
            -MetadataPath ".\store-listing\metadata.json" `
            -AssetsDirectory ".\store-listing\en-us"
          $output | Write-Host
          $submissionId = ($output | Select-String '^SUBMISSION_ID=').Line.Split('=', 2)[1]
          "submission_id=$submissionId" >> $env:GITHUB_OUTPUT

      - name: Report submission
        shell: pwsh
        run: |
          Write-Host "Partner Center submission: ${{ steps.submission.outputs.submission_id }}"
          Write-Host "Installer URL: $env:STORE_INSTALLER_URL"

      - name: Remove sensitive build files
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PATH)) {
            Remove-Item "$env:SIGNING_CERTIFICATE_PATH" `
              -Force `
              -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP "tasklens-msi-validation") `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue
